andy_s_office_scene_toggle:
  alias: Andy's Office Scene Toggle
  use_blueprint:
    path: panhans/scene_toggle.yaml
    input:
      area: andys_office
      included_scenes:
      - scene.andy_s_office_all_lights_honolulu
      - scene.andy_s_office_all_lights_lil_tokyo
      - scene.andy_s_office_all_lights_lust
      use_static_order: true
  description: ''
switchbot_double_press_2:
  alias: SwitchBot Double Press
  mode: single
  sequence:
  - repeat:
      count: 2
      sequence:
      - action: switch.turn_on
        data: {}
        target:
          device_id: 4e7da2a0180cfa7217113732f7b1c424
      - delay:
          hours: 0
          minutes: 0
          seconds: 3
          milliseconds: 0
  description: ''
disney_cruise_chime_with_tts:
  sequence:
  - action: media_player.play_media
    metadata: {}
    data:
      media:
        media_content_id: media-source://media_source/local/Shipboard Announcement
          - Disney Cruise Line [I-11Pk_iN2A].mp3
        media_content_type: audio/mpeg
        metadata:
          title: Shipboard Announcement - Disney Cruise Line [I-11Pk_iN2A].mp3
          thumbnail: null
          media_class: music
          children_media_class: null
          navigateIds:
          - {}
          - media_content_type: app
            media_content_id: media-source://media_source
          browse_entity_id: media_player.home_assistant_voice_0a44a2_media_player
    target:
      entity_id: media_player.home_assistant_voice_0a44a2_media_player
    alias: Play Disney Cruise Chime
  - delay:
      hours: 0
      minutes: 0
      seconds: 4
      milliseconds: 0
  - action: tts.cloud_say
    metadata: {}
    data:
      cache: false
      entity_id: media_player.home_assistant_voice_0a44a2_media_player
      message: 'Ahoy mate. Your wash cycle is complete. '
  alias: Disney Cruise Chime with TTS
  description: ''
