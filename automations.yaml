- id: '1750052296229'
  alias: Washer Machine Cycle Notifier
  description: ''
  use_blueprint:
    path: Blackshome/appliance-notifications.yaml
    input:
      power_sensor: sensor.eve_energy_washer_machine_power
      start_time_delay: 0.25
      running_dead_zone: 3
      include_start_notify: enable_start_notify_options
      start_notify_device:
      - 9ffefedebce49dc943091010a84fcfce
      - ea43a98b40abfb7c7c331ee5be5f2710
      start_title: 'Scrub a dub dub! '
      include_end_notify: enable_end_notify_options
      end_notify_device:
      - 9ffefedebce49dc943091010a84fcfce
      - ea43a98b40abfb7c7c331ee5be5f2710
      end_message_title: AYO BEEP BOOP
      include_power_tracking: enable_power_tracking_and_cost
      include_custom_actions: []
      end_custom_actions: []
      start_appliance_power: 6
      end_appliance_power: 3
      start_custom_actions: []
      start_message: YES! We be cleaning - I'll tap ya when the job is done ;)
      end_message: The wash cycle is finished. Are you going to let it get smelly
        again just to waste more water? :)
      weekday_options:
      - mon
      - tue
      - wed
      - thu
      - fri
      - sun
      - sat
      power_consumption_sensor: sensor.eve_energy_washer_machine_power
      cost_per_kwh: input_number.power_tracker
      start_power_consumption: input_number.power_tracker
      end_power_consumption: input_number.power_tracker
      end_message_kwh: Consumption
      end_message_cost: Approx Cost $
