- id: scrypted_advanced_notifier_snooze_action
  alias: Scrypted advanced notifier snooze action
  description: Automation auto-generated by the scrypted's plugin Advanced notifier
    to handle snooze actions
  triggers:
  - platform: event
    event_type: mobile_app_notification_action
  - platform: event
    event_type: ios.action_fired
  conditions:
  - condition: template
    value_template: '{{ trigger.event.data.action_name is match(''scrypted_an_snooze_.*'')
      or trigger.event.data.action is match(''scrypted_an_snooze_.*'') }}'
  actions:
  - variables:
      event_name: '{% if ''action'' in trigger.event.data %}{{ trigger.event.data.action
        }}{% else %}{{ trigger.event.data.actionName }}{% endif %}'
      suffix: '{% set prefix = ''scrypted_an_snooze_'' %} {{ event_name[prefix|length:]
        }}'
      parts: '{{ suffix.split(''_'') }}'
      camera_id: '{{ parts[0] }}'
      notifier_id: '{{ parts[1] }}'
      snooze_time: '{{ parts[2] }}'
      remaining_parts: '{{ parts[3:] }}'
      snooze_id: '{{ remaining_parts | join(''_'') }}'
  - action: mqtt.publish
    data:
      qos: '0'
      topic: scrypted/scrypted-an-{{ notifier_id }}/snooze/set
      payload: '{"snoozeId":"{{ snooze_id }}","cameraId":"{{ camera_id }}","snoozeTime":"{{
        snooze_time}}"}'
  mode: single
- id: scrypted_advanced_security_system_alarm_action
  alias: Scrypted advanced security system alarm action
  description: Automation auto-generated by the scrypted's plugin Advanced notifier
    to handle alarm actions
  triggers:
  - platform: event
    event_type: mobile_app_notification_action
  - platform: event
    event_type: ios.action_fired
  conditions:
  - condition: template
    value_template: '{{ trigger.event.data.action_name is match(''scrypted_an_alarm_.*'')
      or trigger.event.data.action is match(''scrypted_an_alarm.*'') }}'
  actions:
  - variables:
      event_name: '{% if ''action'' in trigger.event.data %}{{ trigger.event.data.action
        }}{% else %}{{ trigger.event.data.actionName }}{% endif %}'
      suffix: '{% set prefix = ''scrypted_an_alarm_'' %} {{ event_name[prefix|length:]
        }}'
      parts: '{{ suffix.split(''_'') }}'
      mode: '{{ parts[0] }}'
  - action: mqtt.publish
    data:
      qos: '0'
      topic: scrypted/scrypted-an-alarm-system/alarm-system/set
      payload: '{{ mode }}'
  mode: single
