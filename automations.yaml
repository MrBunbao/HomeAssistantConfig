- id: '1759619164580'
  alias: Open Garage when Andy Get's Home and Send Message
  description: Open Garage when Arriving Home
  triggers:
  - alias: When Andy is less than 0.10 km of Home
    value_template: '{{states("sensor.andys_iphone_15_zone_distance")  | float <=
      0.10}}'
    trigger: template
    id: When Andy is less than 0.10 km of Home
  - entity_id:
    - device_tracker.andys_iphone_15
    to: Home
    trigger: state
  conditions:
  - condition: or
    conditions:
    - condition: state
      entity_id: input_boolean.andy_driving_flag
      state: 'on'
    - condition: state
      entity_id: input_boolean.walking_home_flag
      state: 'on'
  actions:
  - alias: execute automation depending if the time is not between 11pm - 7am
    if:
    - condition: time
      after: '23:00:00'
      before: 07:00:00
      weekday:
      - sun
      - mon
      - tue
      - wed
      - thu
      - fri
      - sat
    then:
    - variables:
        late_msgs:
        - Late arrival detected. Standing down the auto-open—sleep mode engaged.
        - It’s late—garage auto-open aborted for safety.
        - Night hours. Not opening the garage automatically.
        late_pick: '{{ late_msgs | random }}'
    - device_id: 647558d51a8c2aeacdae47429da048b7
      domain: mobile_app
      type: notify
      message: '{{ late_pick }}'
    else:
    - variables:
        titles:
        - Hey 5 foot 10 king
        - Welcome back my Liege
        - Home base reached
        - Touchdown
        greetings:
        - Hope your day was s'well. Get inside, my guy. Mwah.
        - Garage warming up. Watch your step.
        - You made it. Keys, phone, wallet—then inside you go.
        - Parking complete. Door’s on standby.
        - Welcome home—executing garage sequence.
        last: '{{ states(''input_text.last_arrival_msg'') }}'
        msg: "{{\n  (greetings | reject('equalto', last) | list | random)\n  if last
          in greetings\n  else (greetings | random)\n}}"
    - action: notify.mobile_app_andys_iphone_15
      data:
        title: '{{ titles | random }}'
        message: '{{ msg }}'
    - action: input_text.set_value
      data:
        entity_id: input_text.last_arrival_msg
        value: '{{ msg }}'
    - alias: Open Garage
      action: cover.open_cover
      data: {}
      target:
        entity_id: cover.smart_garage_door_2310087254725461070248e1e9dd51a3_garage
      enabled: true
  mode: single
