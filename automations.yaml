        - Hi my love
        - Hello gorgeous
        - My sweet baby
        - Love of my life
        - My forever girl
        - Hey beautiful soul
        - My precious Shannon
        - The reason my heart beats
        greetings:
        - You’re home, baby — my heart just got complete again. ❤️
        - "My love, every arrival feels like the best gift. \U0001F381"
        - "The world feels right again because you’re here, Shannon. \U0001F30E\U0001F495"
        - "You’re the melody my life was missing — welcome home, baby. \U0001F3B6"
        - My baby’s home! Life just got brighter. ☀️
        - "Every time I see you walk in, I fall in love again. \U0001F496"
        - "Baby, your presence is my favorite comfort. \U0001F917"
        - Shannon, my love, you are my always and forever. ♾️
        - "Garage is opening, but it’s my arms that want to hold you. \U0001F970"
        - "My queen is home — I love you endlessly. \U0001F451❤️"
        last: '{{ states(''input_text.last_arrival_msg'') }}'
        msg: "{{\n  (greetings | reject('equalto', last) | list | random)\n  if last
          in greetings\n  else (greetings | random)\n}}"
      enabled: true
    - action: notify.mobile_app_shannons_iphone
      data:
        message: Do not go to through the garage door. You may park, but go to the
          side of house back gate.
        title: Why Hello, There, To Be Mrs. Dao.
    - action: input_text.set_value
      data:
        entity_id: input_text.last_arrival_msg
        value: '{{ msg }}'
      enabled: true
    - alias: Open Garage
      action: cover.open_cover
      data: {}
      target:
        entity_id: cover.smart_garage_door_2310087254725461070248e1e9dd51a3_garage
      enabled: true
  mode: single
